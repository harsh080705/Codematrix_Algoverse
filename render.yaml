services:
  - type: web
    name: aihub-api
    runtime: docker
    repo: https://github.com/your-org/aihub-x402-marketplace
    dockerfilePath: ./apps/api/Dockerfile
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: PORT
        value: "8080"
      - key: MONGODB_URI
        sync: false # set in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: X402_FACILITATOR_URL
        value: https://facilitator.goplausible.xyz
      - key: X402_NETWORK
        value: algorand:testnet
      - key: X402_PAY_TO
        sync: false
      - key: X402_ASSET
        value: USDC
      - key: ALGORAND_NETWORK
        value: testnet
      - key: CORS_ORIGIN
        value: https://your-app.vercel.app

databases:
  - name: aihub-mongo
    plan: free
    databaseName: aihub
